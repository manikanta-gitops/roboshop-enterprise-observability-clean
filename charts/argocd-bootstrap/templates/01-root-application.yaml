{{- /* App-of-apps root for the dev environment. Mirrors gitops/applications/root-dev.yaml. */}}
{{- /* Applied once per cluster by Terraform (helm release argocd-bootstrap). */}}
{{- /* Everything else (ApplicationSet -> 11 Applications) is pulled from Git. */}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: roboshop-dev-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    roboshop.io/environment: dev
spec:
  project: roboshop
  source:
    repoURL: {{ .Values.repoUrl }}
    targetRevision: {{ .Values.targetRevision }}
    path: gitops/applicationsets
    directory:
      recurse: false
      include: 'roboshop-dev.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  # syncPolicy is a child of spec - NOT of destination.
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
  revisionHistoryLimit: 10
