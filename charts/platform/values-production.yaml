# platform - production overrides.
environment: production
namespace: roboshop-production

namespaceResource:
  create: true
  labels:
    name: roboshop-production

resourceQuota:
  enabled: true
  hard:
    requests.cpu: "24"
    requests.memory: 48Gi
    limits.cpu: "48"
    limits.memory: 96Gi
    persistentvolumeclaims: "20"

storageClass:
  enabled: true   # cluster-scoped: created once per cluster
  name: gp3
  # Production volumes survive a chart/PVC delete and opt in to AWS Backup.
  reclaimPolicy: Retain
  parameters:
    type: gp3
    fsType: ext4
    encrypted: "true"
    tagSpecification_1: "backup=daily"

sharedConfig:
  enabled: true
  data:
    NODE_ENV: "production"

secrets:
  mode: external-secrets
  externalSecrets:
    remoteKey: roboshop/production/app
    refreshInterval: 15m

ingress:
  enabled: true
  ingressClass:
    create: true   # cluster-scoped: created once per cluster
  alb:
    loadBalancerName: roboshop-alb
    groupName: roboshop
    scheme: internet-facing
    listenPorts: '[{"HTTP":80},{"HTTPS":443}]'
    certificateArn: ""
    sslRedirect: "443"
    wafv2AclArn: ""
    tags:
      Project: roboshop
      Environment: production
      ManagedBy: helm
  hosts:
    - host: shop.streenzo.online
      paths:
        - path: /api/catalogue
          pathType: Prefix
          serviceName: catalogue
          servicePort: 8080
        - path: /api/user
          pathType: Prefix
          serviceName: user
          servicePort: 8080
        - path: /api/cart
          pathType: Prefix
          serviceName: cart
          servicePort: 8080
        - path: /api/payment
          pathType: Prefix
          serviceName: payment
          servicePort: 8080
        - path: /api/shipping
          pathType: Prefix
          serviceName: shipping
          servicePort: 8080
        - path: /
          pathType: Prefix
          serviceName: frontend
          servicePort: 80

networkPolicies:
  enabled: true
