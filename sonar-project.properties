# Repository-wide SonarQube defaults. The CI pipeline overrides projectKey and
# projectBaseDir per service, so this file is what you get when you run the
# scanner manually from the repo root:
#   sonar-scanner -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.token=$SONAR_TOKEN
sonar.projectKey=roboshop
sonar.projectName=Roboshop Platform
sonar.projectVersion=1.0

sonar.sources=apps
sonar.sourceEncoding=UTF-8

sonar.exclusions=\
  **/node_modules/**,\
  **/target/**,\
  **/static/vendor/**,\
  **/*.min.js,\
  docs/**

sonar.javascript.lcov.reportPaths=apps/**/coverage/lcov.info
sonar.python.coverage.reportPaths=apps/**/coverage.xml
sonar.java.binaries=apps/shipping/target/classes

# Quality gate: block the pipeline when new code regresses.
sonar.qualitygate.wait=true
