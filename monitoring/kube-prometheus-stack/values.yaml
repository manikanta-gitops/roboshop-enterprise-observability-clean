# ---------------------------------------------------------------------------
# kube-prometheus-stack values (Prometheus + Alertmanager + Grafana + exporters)
# Chart: prometheus-community/kube-prometheus-stack
# Applied by gitops/platform/monitoring.yaml
# ---------------------------------------------------------------------------

fullnameOverride: monitoring

# The operator discovers ServiceMonitors in every namespace, so the Roboshop
# charts can ship their own ServiceMonitor without touching this file.
prometheus:
  prometheusSpec:
    retention: 15d
    retentionSize: 40GB
    scrapeInterval: 30s
    evaluationInterval: 30s
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    externalLabels:
      cluster: roboshop
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        memory: 3Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      fsGroup: 2000

alertmanager:
  alertmanagerSpec:
    retention: 120h
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi

  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname', 'namespace', 'service']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: slack-warning
      routes:
        - matchers: ['severity = critical']
          receiver: slack-critical
          repeat_interval: 1h
          continue: true
        - matchers: ['severity = info']
          receiver: 'null'
    receivers:
      - name: 'null'
      - name: slack-warning
        slack_configs:
          - channel: '#roboshop-alerts'
            send_resolved: true
            title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
            text: >-
              {{ range .Alerts }}*{{ .Labels.namespace }}/{{ .Labels.service }}*
              {{ .Annotations.summary }}
              {{ .Annotations.description }}
              {{ end }}
      - name: slack-critical
        slack_configs:
          - channel: '#roboshop-incidents'
            send_resolved: true
            title: '[CRITICAL] {{ .CommonLabels.alertname }}'
            text: >-
              {{ range .Alerts }}{{ .Annotations.description }}
              Runbook: {{ .Annotations.runbook_url }}
              {{ end }}
    inhibit_rules:
      - source_matchers: ['severity = critical']
        target_matchers: ['severity = warning']
        equal: ['namespace', 'alertname']

grafana:
  enabled: true
  replicas: 1
  defaultDashboardsTimezone: browser

  admin:
    existingSecret: grafana-admin        # created by External Secrets
    userKey: admin-user
    passwordKey: admin-password

  persistence:
    enabled: true
    storageClassName: gp3
    size: 10Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
    datasources:
      enabled: true

  additionalDataSources:
    - name: OpenSearch
      type: grafana-opensearch-datasource
      url: https://opensearch-cluster-master.logging.svc.cluster.local:9200
      access: proxy
      jsonData:
        database: 'roboshop-*'
        flavor: OpenSearch
        version: 2.11.0
        timeField: '@timestamp'
        tlsSkipVerify: true

  plugins:
    - grafana-opensearch-datasource

  grafana.ini:
    server:
      root_url: https://grafana.example.com
    auth.anonymous:
      enabled: false
    users:
      viewers_can_edit: false

# The ALB is created by the AWS Load Balancer Controller.
  ingress:
    enabled: true
    ingressClassName: alb
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
      alb.ingress.kubernetes.io/ssl-redirect: '443'
      alb.ingress.kubernetes.io/group.name: roboshop-platform
    hosts:
      - grafana.example.com

# EKS manages the control plane; these scrape targets do not exist.
kubeApiServer:
  enabled: true
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: true

nodeExporter:
  enabled: true
kubeStateMetrics:
  enabled: true

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
