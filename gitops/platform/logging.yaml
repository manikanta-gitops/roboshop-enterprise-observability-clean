---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fluent-bit
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-13"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  sources:
    - repoURL: https://fluent.github.io/helm-charts
      chart: fluent-bit
      targetRevision: 0.47.5
      helm:
        releaseName: fluent-bit
        valueFiles:
          - $values/logging/fluent-bit/values.yaml
    - repoURL: https://github.com/manikanta-gitops/roboshop-enterprise-observability-clean.git
