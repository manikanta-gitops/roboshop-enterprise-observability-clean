# ---------------------------------------------------------------------------
# Prometheus + Alertmanager + Grafana.
# Sync wave -20: monitoring must exist before the workloads it scrapes.
# Values live in this repo (second source, ref: values).
# ---------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 62.3.0
      helm:
        releaseName: monitoring
        valueFiles:
          - $values/monitoring/kube-prometheus-stack/values.yaml
    - repoURL: https://github.com/manikanta-gitops/roboshop-enterprise.git
      targetRevision: main
      ref: values
    # Alert rules and dashboards shipped as plain manifests.
    - repoURL: https://github.com/manikanta-gitops/roboshop-enterprise.git
      targetRevision: main
      path: monitoring/rules
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      # CRDs in kube-prometheus-stack exceed the annotation size limit.
      - Replace=true
    retry:
      limit: 5
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 10m
  revisionHistoryLimit: 5
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
