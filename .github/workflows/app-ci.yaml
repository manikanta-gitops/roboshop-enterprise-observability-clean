# =============================================================================
# Application CI/CD
#
# checkout -> deps -> unit test -> build -> SonarQube -> OWASP Dependency-Check
#   -> docker build -> Trivy -> SBOM -> scanned artifact -> dev ECR -> GitOps PR
#
# Only the services whose files changed are built. Images are tagged with the
# commit SHA (immutable).
#
# Manual workflow_dispatch can force-build one service.
# Manual dispatch publishes to ECR but does NOT perform GitOps write-back.
# GitOps write-back happens only for normal pushes to main.
# =============================================================================

name: app-ci

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - '.github/workflows/app-ci.yaml'

  pull_request:
    branches: [main]

  workflow_dispatch:
    inputs:
      service:
        description: 'Select a service to force-build'
        required: false
        type: choice
        default: auto
        options:
          - all
          - auto
          - cart
          - catalogue
          - user
          - payment
          - shipping
          - frontend
          - mongodb
          - mysql

permissions:
  contents: read
  security-events: write

env:
  AWS_REGION: ${{ vars.DEV_AWS_REGION || 'ap-south-1' }}
  ECR_NAMESPACE: roboshop

jobs:

  # ---------------------------------------------------------------------------
  # 1. Detect changed services
  # ---------------------------------------------------------------------------
  detect:
    name: detect changed services
    runs-on: ubuntu-latest

    outputs:
      services: ${{ steps.set.outputs.services }}
      any: ${{ steps.set.outputs.any }}
      environment: ${{ steps.env.outputs.environment }}

    steps:

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            cart:      ['apps/cart/**']
            catalogue: ['apps/catalogue/**']
            user:      ['apps/user/**']
            payment:   ['apps/payment/**']
            shipping:  ['apps/shipping/**']
            frontend:  ['apps/frontend/**']
            mongodb:   ['apps/mongodb/**']
            mysql:     ['apps/mysql/**']

      # Values from workflow_dispatch/action outputs are passed through env
      # instead of directly interpolating them into shell commands.
      - id: set
        env:
          DISPATCH_SERVICE: ${{ inputs.service }}
          DETECTED_SERVICES: ${{ steps.filter.outputs.changes }}
        run: |
          set -euo pipefail

          if [ "$DISPATCH_SERVICE" = "all" ]; then
            SERVICES='["cart","catalogue","user","payment","shipping","frontend","mongodb","mysql"]'
          elif [ -n "$DISPATCH_SERVICE" ] && [ "$DISPATCH_SERVICE" != "auto" ]; then
            SERVICES=$(printf '["%s"]' "$DISPATCH_SERVICE")
          else
            SERVICES="$DETECTED_SERVICES"
          fi

          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"

          if [ "$SERVICES" = "[]" ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi

          echo "Building: $SERVICES"

      - id: env
        run: echo "environment=dev" >> "$GITHUB_OUTPUT"


  # ---------------------------------------------------------------------------
  # 2. Test, scan and build
  # ---------------------------------------------------------------------------
  build:
    name: build ${{ matrix.service }}

    needs: detect

    if: needs.detect.outputs.any == 'true'

    runs-on: ubuntu-latest

    timeout-minutes: 30

    env:
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
      SERVICE_DIR: apps/${{ matrix.service }}

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect.outputs.services) }}

    steps:

      # -----------------------------------------------------------------------
      # Checkout
      # -----------------------------------------------------------------------
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # -----------------------------------------------------------------------
      # Detect application language
      # -----------------------------------------------------------------------
      - name: Detect language
        id: lang
        run: |
          set -euo pipefail

          d="${{ env.SERVICE_DIR }}"

          if [ -f "$d/package.json" ]; then
            echo "lang=node" >> "$GITHUB_OUTPUT"

          elif [ -f "$d/pom.xml" ]; then
            echo "lang=java" >> "$GITHUB_OUTPUT"

          elif [ -f "$d/requirements.txt" ]; then
            echo "lang=python" >> "$GITHUB_OUTPUT"

          else
            echo "lang=static" >> "$GITHUB_OUTPUT"
          fi


      # -----------------------------------------------------------------------
      # Node.js
      # -----------------------------------------------------------------------
      - uses: actions/setup-node@v4
        if: steps.lang.outputs.lang == 'node'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ env.SERVICE_DIR }}/package-lock.json


      # -----------------------------------------------------------------------
      # Java application runtime
      #
      # Keep Java 17 for the actual application build/test.
      # SonarScanner has its own Java 21 runtime through Scanner CLI v8.
      # -----------------------------------------------------------------------
      - uses: actions/setup-java@v4
        if: steps.lang.outputs.lang == 'java'
        with:
          distribution: temurin
          java-version: '17'
          cache: maven


      # -----------------------------------------------------------------------
      # Python
      # -----------------------------------------------------------------------
      - uses: actions/setup-python@v5
        if: steps.lang.outputs.lang == 'python'
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ${{ env.SERVICE_DIR }}/requirements.txt


      # -----------------------------------------------------------------------
      # Install dependencies
      # -----------------------------------------------------------------------
      - name: Install dependencies
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          set -euo pipefail

          case "${{ steps.lang.outputs.lang }}" in

            node)
              npm ci --no-audit --no-fund
              ;;

            java)
              mvn -B -ntp dependency:go-offline
              ;;

            python)
              python -m pip install --upgrade pip
              pip install -r requirements.txt
              pip install pytest
              ;;

            static)
              echo "no dependencies"
              ;;

          esac


      # -----------------------------------------------------------------------
      # Unit tests
      # -----------------------------------------------------------------------
      - name: Unit tests
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          set -euo pipefail

          case "${{ steps.lang.outputs.lang }}" in

            node)
              npm test
              ;;

            java)
              mvn -B -ntp test
              ;;

            python)
              if [ -d tests ]; then
                pytest -q
              else
                echo "No tests directory - skipping pytest"
              fi
              ;;

            static)
              echo "static asset service - nothing to unit test"
              ;;

          esac


      # -----------------------------------------------------------------------
      # Application build
      # -----------------------------------------------------------------------
      - name: Build application
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          set -euo pipefail

          case "${{ steps.lang.outputs.lang }}" in

            java)
              mvn -B -ntp -DskipTests package
              ;;

            node)
              npm run build --if-present
              ;;

            *)
              echo "no build step"
              ;;

          esac


      # -----------------------------------------------------------------------
      # SonarQube configuration validation
      # -----------------------------------------------------------------------
      - name: Require SonarQube configuration on protected PRs
        if: github.event_name == 'pull_request'
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail

          [ -n "${SONAR_HOST_URL:-}" ] || {
            echo "::error::SONAR_HOST_URL is required for PR CI"
            exit 1
          }

          [ -n "${SONAR_TOKEN:-}" ] || {
            echo "::error::SONAR_TOKEN is required for PR CI"
            exit 1
          }


      # -----------------------------------------------------------------------
      # SonarQube scan
      #
      # Scanner CLI v8 uses Java 21.
      # Therefore we DO NOT change the application's Java 17 runtime above.
      # -----------------------------------------------------------------------
      - name: SonarQube scan
        if: ${{ env.SONAR_HOST_URL != '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        with:
          projectBaseDir: ${{ env.SERVICE_DIR }}
          args: >
            -Dsonar.projectKey=roboshop-${{ matrix.service }}
            -Dsonar.projectName=roboshop-${{ matrix.service }}
            -Dsonar.sources=.
            -Dsonar.exclusions=**/node_modules/**,**/target/**,**/static/vendor/**


      # -----------------------------------------------------------------------
      # SonarQube quality gate
      #
      # Quality gate is enforced on pull requests.
      # -----------------------------------------------------------------------
      - name: SonarQube quality gate
        if: ${{ env.SONAR_HOST_URL != '' && github.event_name == 'pull_request' }}
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 10
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}


      # -----------------------------------------------------------------------
      # OWASP Dependency-Check cache
      # -----------------------------------------------------------------------
      - name: Cache OWASP Dependency-Check NVD
        uses: actions/cache@v4
        with:
          path: ~/.cache/dependency-check
          key: owasp-dc-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            owasp-dc-${{ runner.os }}-


      # -----------------------------------------------------------------------
      # OWASP Dependency-Check
      #
      # @v6 does not exist.
      #
      # JAVA_HOME must be reset to /opt/jdk because setup-java above changes
      # JAVA_HOME and the Dependency-Check action runs in its own container.
      # -----------------------------------------------------------------------
      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        env:
          JAVA_HOME: /opt/jdk
        with:
          project: roboshop-${{ matrix.service }}
          path: ${{ env.SERVICE_DIR }}
          format: 'ALL'
          args: >
            --failOnCVSS 8
            --enableRetired
            --suppression security/dependency-check-suppression.xml


      # -----------------------------------------------------------------------
      # Upload Dependency-Check report
      # -----------------------------------------------------------------------
      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-${{ matrix.service }}-${{ github.sha }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 14


      # -----------------------------------------------------------------------
      # Docker Buildx
      # -----------------------------------------------------------------------
      - uses: docker/setup-buildx-action@v3


      # -----------------------------------------------------------------------
      # Docker image build
      # -----------------------------------------------------------------------
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.SERVICE_DIR }}
          push: false
          load: true
          tags: ${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: false


      # -----------------------------------------------------------------------
      # Trivy image vulnerability scan
      #
      # This remains a BLOCKING security gate.
      # CRITICAL/HIGH vulnerabilities cause exit code 1.
      # -----------------------------------------------------------------------
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.service }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'


      # -----------------------------------------------------------------------
      # Generate SBOM
      # -----------------------------------------------------------------------
      - name: Generate SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.service }}:${{ github.sha }}
          format: cyclonedx
          output: sbom-${{ matrix.service }}.cdx.json
          severity: 'CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN'


      # -----------------------------------------------------------------------
      # Upload Trivy/SBOM artifacts
      #
      # if-no-files-found prevents a secondary failure if an earlier scan
      # failed before creating the artifacts.
      # -----------------------------------------------------------------------
      - name: Upload security artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-${{ matrix.service }}-${{ github.sha }}
          path: |
            trivy-${{ matrix.service }}.sarif
            sbom-${{ matrix.service }}.cdx.json
          if-no-files-found: ignore
          retention-days: 30


      # -----------------------------------------------------------------------
      # Upload Trivy SARIF to GitHub Security
      #
      # Only execute if the SARIF file actually exists.
      # -----------------------------------------------------------------------
      - name: Upload Trivy SARIF
        if: ${{ always() && hashFiles(format('trivy-{0}.sarif', matrix.service)) != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}


      # -----------------------------------------------------------------------
      # Export exact scanned image
      # -----------------------------------------------------------------------
      - name: Export scanned image
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail

          docker save \
            "${{ matrix.service }}:${{ github.sha }}" \
            -o "${{ matrix.service }}.tar"


      # -----------------------------------------------------------------------
      # Upload exact scanned image
      # -----------------------------------------------------------------------
      - name: Upload scanned image artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.service }}-${{ github.sha }}
          path: ${{ matrix.service }}.tar
          if-no-files-found: error
          retention-days: 1


  # ---------------------------------------------------------------------------
  # 3. Publish to Dev ECR
  #
  # Runs for:
  #   - normal push to main
  #   - manual workflow_dispatch
  #
  # Does NOT run for pull requests.
  # ---------------------------------------------------------------------------
  publish:
    name: publish ${{ matrix.service }} to dev ECR

    needs: [detect, build]

    if: >
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.detect.outputs.any == 'true'

    runs-on: ubuntu-latest

    environment: dev

    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect.outputs.services) }}

    steps:

      # -----------------------------------------------------------------------
      # Download exact scanned image
      # -----------------------------------------------------------------------
      - uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.service }}-${{ github.sha }}
          path: image


      # -----------------------------------------------------------------------
      # Load exact scanned image
      # -----------------------------------------------------------------------
      - name: Load scanned image
        run: |
          set -euo pipefail

          docker load \
            -i "image/${{ matrix.service }}.tar"


      # -----------------------------------------------------------------------
      # AWS OIDC
      # -----------------------------------------------------------------------
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # -----------------------------------------------------------------------
      # ECR login
      # -----------------------------------------------------------------------
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr


      # -----------------------------------------------------------------------
      # Push immutable image
      # -----------------------------------------------------------------------
      - name: Push immutable commit image to ECR
        id: push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail

          REPO="$REGISTRY/$ECR_NAMESPACE/${{ matrix.service }}"

          docker tag \
            "${{ matrix.service }}:${{ github.sha }}" \
            "$REPO:${{ github.sha }}"

          docker push "$REPO:${{ github.sha }}"

          DIGEST=$(
            docker inspect \
              --format='{{index .RepoDigests 0}}' \
              "$REPO:${{ github.sha }}" |
              cut -d@ -f2
          )

          echo "image=$REPO@$DIGEST" >> "$GITHUB_OUTPUT"

          echo "pushed $REPO:${{ github.sha }}@$DIGEST"


      # -----------------------------------------------------------------------
      # Cosign
      # -----------------------------------------------------------------------
      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0


      # -----------------------------------------------------------------------
      # Sign immutable ECR image
      # -----------------------------------------------------------------------
      - name: Sign image with GitHub OIDC
        env:
          IMAGE: ${{ steps.push.outputs.image }}
        run: |
          set -euo pipefail

          cosign sign --yes "$IMAGE"


  # ---------------------------------------------------------------------------
  # 4. CI Gate
  # ---------------------------------------------------------------------------
  ci-gate:
    name: ci gate

    if: always()

    needs: [detect, build, publish]

    runs-on: ubuntu-latest

    steps:

      - name: Evaluate application CI
        env:
          DETECT_RESULT: ${{ needs.detect.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          set -euo pipefail

          if [[ "$DETECT_RESULT" != "success" ]]; then
            echo "detect failed"
            exit 1
          fi

          if [[ "$BUILD_RESULT" == "failure" || "$BUILD_RESULT" == "cancelled" ]]; then
            echo "application build/test/scan failed"
            exit 1
          fi

          if [[ "$PUBLISH_RESULT" == "failure" || "$PUBLISH_RESULT" == "cancelled" ]]; then
            echo "application publish failed"
            exit 1
          fi

          echo "Application CI gate passed."


  # ---------------------------------------------------------------------------
  # 5. GitOps write-back for development
  #
  # IMPORTANT:
  # Manual workflow_dispatch does NOT automatically modify GitOps.
  #
  # Only a normal push to main performs GitOps write-back.
  # ---------------------------------------------------------------------------
  gitops:
    name: gitops write-back (dev)

    needs: [detect, publish]

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.detect.outputs.any == 'true'

    runs-on: ubuntu-latest

    environment: dev

    permissions:
      contents: write
      pull-requests: write
      id-token: write

    concurrency:
      group: gitops-writeback-${{ needs.detect.outputs.environment }}
      cancel-in-progress: false

    steps:

      # -----------------------------------------------------------------------
      # Checkout GitOps repository/workspace
      # -----------------------------------------------------------------------
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITOPS_TOKEN || github.token }}


      # -----------------------------------------------------------------------
      # yq
      # -----------------------------------------------------------------------
      - uses: mikefarah/yq@v4.44.3


      # -----------------------------------------------------------------------
      # AWS OIDC
      # -----------------------------------------------------------------------
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # -----------------------------------------------------------------------
      # Update image registry, tag and digest
      # -----------------------------------------------------------------------
      - name: Bump image registry and image tags
        env:
          SERVICES: ${{ needs.detect.outputs.services }}
          ENVIRONMENT: ${{ needs.detect.outputs.environment }}
        run: |
          set -euo pipefail

          REGISTRY=$(
            aws ecr describe-registry \
              --region "${AWS_REGION}" \
              --query 'registryId' \
              --output text
          ).dkr.ecr.${AWS_REGION}.amazonaws.com

          yq -i \
            ".image.registry = \"$REGISTRY\"" \
            environments/dev/global-values.yaml

          for svc in $(echo "$SERVICES" | yq -r '.[]' -p json); do

            f="charts/$svc/values-$ENVIRONMENT.yaml"

            if [ ! -f "$f" ]; then
              echo "skip $f (missing)"
              continue
            fi

            digest=$(
              aws ecr describe-images \
                --region "$AWS_REGION" \
                --repository-name "$ECR_NAMESPACE/$svc" \
                --image-ids imageTag="${GITHUB_SHA}" \
                --query 'imageDetails[0].imageDigest' \
                --output text
            )

            if [ -z "$digest" ] || [ "$digest" = "None" ]; then
              echo "::error::Unable to find ECR digest for $svc:${GITHUB_SHA}"
              exit 1
            fi

            yq -i \
              ".image.repository = \"$ECR_NAMESPACE/$svc\" |
               .image.tag = \"${GITHUB_SHA}\" |
               .image.digest = \"$digest\"" \
              "$f"

            echo "updated $f -> $ECR_NAMESPACE/$svc:${GITHUB_SHA}@$digest"

          done


      # -----------------------------------------------------------------------
      # Validate Helm values
      # -----------------------------------------------------------------------
      - name: Validate Helm values YAML
        run: |
          set -euo pipefail

          for f in charts/*/values-*.yaml; do

            [ -f "$f" ] || continue

            yq eval '.' "$f" > /dev/null || {
              echo "::error::Invalid YAML: $f"
              exit 1
            }

          done


      # -----------------------------------------------------------------------
      # Submit GitOps PR
      # -----------------------------------------------------------------------
      - name: Submit GitOps PR
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN || github.token }}
        run: |
          set -euo pipefail

          ./scripts/create-gitops-pr.sh \
            "automation/dev-${{ github.run_id }}" \
            "chore(deploy): dev -> ${{ github.sha }}" \
            "chore(deploy): promote ${{ github.sha }} to dev" \
            "Automated GitOps update from application CI for commit ${{ github.sha }}."


  # ---------------------------------------------------------------------------
  # TEMP OIDC diagnostic
  #
  # TEMPORARY standalone job to capture the GitHub-issued OIDC claims for this
  # repository under environment: dev. Runs only on manual workflow_dispatch and
  # depends on no other job. Prints ONLY iss/aud/sub from the JWT payload - never
  # the token itself, request token, or any secret. Remove after diagnosis.
  # ---------------------------------------------------------------------------
  temp-oidc-diagnostic:
    name: TEMP OIDC diagnostic
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    environment: dev

    permissions:
      contents: read
      id-token: write

    steps:

      - name: TEMP print OIDC claims (iss, aud, sub only)
        run: |
          set -euo pipefail
          TOKEN="$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')"
          PAYLOAD="$(python3 -c "import sys,base64,json;p=sys.argv[1].split('.')[1];p+='='*(-len(p)%4);print(json.dumps(json.loads(base64.urlsafe_b64decode(p))))" "$TOKEN")"
          python3 -c "import sys,json;d=json.loads(sys.argv[1]);print('iss='+str(d.get('iss')));print('aud='+str(d.get('aud')));print('sub='+str(d.get('sub')))" "$PAYLOAD"
