# =============================================================================
# Application CI/CD
#
# checkout -> deps -> unit test -> build -> SonarQube -> OWASP Dependency-Check
#   -> docker build -> Trivy -> SBOM -> scanned artifact -> dev ECR
#   -> CI Gate -> GitOps PR -> ArgoCD -> EKS
#
# Only services whose files changed are built.
# Images are tagged with the commit SHA (immutable).
#
# Manual workflow_dispatch can force-build one service.
# Manual dispatch also performs GitOps write-back after CI passes.
#
# GitOps NEVER deploys directly to Kubernetes.
# ArgoCD remains responsible for deployment.
# =============================================================================

name: app-ci

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - '.github/workflows/app-ci.yaml'

  pull_request:
    branches: [main]

  workflow_dispatch:
    inputs:
      service:
        description: 'Select a service to force-build'
        required: false
        type: choice
        default: auto
        options:
          - all
          - auto
          - cart
          - catalogue
          - user
          - payment
          - shipping
          - frontend
          - mongodb
          - mysql

permissions:
  contents: read
  security-events: write

env:
  AWS_REGION: ${{ vars.DEV_AWS_REGION || 'ap-south-1' }}
  ECR_NAMESPACE: roboshop

jobs:

  # ===========================================================================
  # 1. Detect changed services
  # ===========================================================================
  detect:
    name: detect changed services
    runs-on: ubuntu-latest

    outputs:
      services: ${{ steps.set.outputs.services }}
      any: ${{ steps.set.outputs.any }}
      environment: ${{ steps.env.outputs.environment }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed services
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            cart:      ['apps/cart/**']
            catalogue: ['apps/catalogue/**']
            user:      ['apps/user/**']
            payment:   ['apps/payment/**']
            shipping:  ['apps/shipping/**']
            frontend:  ['apps/frontend/**']
            mongodb:   ['apps/mongodb/**']
            mysql:     ['apps/mysql/**']

      - name: Select services
        id: set
        env:
          DISPATCH_SERVICE: ${{ inputs.service }}
          DETECTED_SERVICES: ${{ steps.filter.outputs.changes }}
        run: |
          set -euo pipefail

          if [ "$DISPATCH_SERVICE" = "all" ]; then
            SERVICES='["cart","catalogue","user","payment","shipping","frontend","mongodb","mysql"]'

          elif [ -n "$DISPATCH_SERVICE" ] && [ "$DISPATCH_SERVICE" != "auto" ]; then
            SERVICES=$(printf '["%s"]' "$DISPATCH_SERVICE")

          else
            SERVICES="$DETECTED_SERVICES"
          fi

          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"

          if [ "$SERVICES" = "[]" ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi

          echo "Building services: $SERVICES"

      - name: Set environment
        id: env
        run: |
          echo "environment=dev" >> "$GITHUB_OUTPUT"


  # ===========================================================================
  # 2. Test, scan and build
  # ===========================================================================
  build:
    name: build ${{ matrix.service }}

    needs: detect

    if: needs.detect.outputs.any == 'true'

    runs-on: ubuntu-latest

    timeout-minutes: 30

    env:
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
      SERVICE_DIR: apps/${{ matrix.service }}

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect.outputs.services) }}

    steps:

      # -----------------------------------------------------------------------
      # Checkout
      # -----------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # -----------------------------------------------------------------------
      # Detect application language
      # -----------------------------------------------------------------------
      - name: Detect language
        id: lang
        run: |
          set -euo pipefail

          d="${{ env.SERVICE_DIR }}"

          if [ -f "$d/package.json" ]; then
            echo "lang=node" >> "$GITHUB_OUTPUT"

          elif [ -f "$d/pom.xml" ]; then
            echo "lang=java" >> "$GITHUB_OUTPUT"

          elif [ -f "$d/requirements.txt" ]; then
            echo "lang=python" >> "$GITHUB_OUTPUT"

          else
            echo "lang=static" >> "$GITHUB_OUTPUT"
          fi


      # -----------------------------------------------------------------------
      # Node.js
      # -----------------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        if: steps.lang.outputs.lang == 'node'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ env.SERVICE_DIR }}/package-lock.json


      # -----------------------------------------------------------------------
      # Java
      # -----------------------------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        if: steps.lang.outputs.lang == 'java'
        with:
          distribution: temurin
          java-version: '17'
          cache: maven


      # -----------------------------------------------------------------------
      # Python
      # -----------------------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        if: steps.lang.outputs.lang == 'python'
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ${{ env.SERVICE_DIR }}/requirements.txt


      # -----------------------------------------------------------------------
      # Install dependencies
      # -----------------------------------------------------------------------
      - name: Install dependencies
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          set -euo pipefail

          case "${{ steps.lang.outputs.lang }}" in

            node)
              npm ci --no-audit --no-fund
              ;;

            java)
              mvn -B -ntp dependency:go-offline
              ;;

            python)
              python -m pip install --upgrade pip
              pip install -r requirements.txt
              pip install pytest
              ;;

            static)
              echo "no dependencies"
              ;;

          esac


      # -----------------------------------------------------------------------
      # Unit tests
      # -----------------------------------------------------------------------
      - name: Unit tests
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          set -euo pipefail

          case "${{ steps.lang.outputs.lang }}" in

            node)
              npm test
              ;;

            java)
              mvn -B -ntp test
              ;;

            python)
              if [ -d tests ]; then
                pytest -q
              else
                echo "No tests directory - skipping pytest"
              fi
              ;;

            static)
              echo "static asset service - nothing to unit test"
              ;;

          esac


      # -----------------------------------------------------------------------
      # Application build
      # -----------------------------------------------------------------------
      - name: Build application
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          set -euo pipefail

          case "${{ steps.lang.outputs.lang }}" in

            java)
              mvn -B -ntp -DskipTests package
              ;;

            node)
              npm run build --if-present
              ;;

            *)
              echo "no build step"
              ;;

          esac


      # -----------------------------------------------------------------------
      # SonarQube configuration validation
      # -----------------------------------------------------------------------
      - name: Require SonarQube configuration on protected PRs
        if: github.event_name == 'pull_request'
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail

          [ -n "${SONAR_HOST_URL:-}" ] || {
            echo "::error::SONAR_HOST_URL is required for PR CI"
            exit 1
          }

          [ -n "${SONAR_TOKEN:-}" ] || {
            echo "::error::SONAR_TOKEN is required for PR CI"
            exit 1
          }


      # -----------------------------------------------------------------------
      # SonarQube scan
      # -----------------------------------------------------------------------
      - name: SonarQube scan
        if: ${{ env.SONAR_HOST_URL != '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        with:
          projectBaseDir: ${{ env.SERVICE_DIR }}
          args: >
            -Dsonar.projectKey=roboshop-${{ matrix.service }}
            -Dsonar.projectName=roboshop-${{ matrix.service }}
            -Dsonar.sources=.
            -Dsonar.exclusions=**/node_modules/**,**/target/**,**/static/vendor/**


      # -----------------------------------------------------------------------
      # SonarQube quality gate
      # -----------------------------------------------------------------------
      - name: SonarQube quality gate
        if: ${{ env.SONAR_HOST_URL != '' && github.event_name == 'pull_request' }}
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 10
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}


      # -----------------------------------------------------------------------
      # OWASP Dependency-Check cache
      # -----------------------------------------------------------------------
      - name: Cache OWASP Dependency-Check NVD
        uses: actions/cache@v4
        with:
          path: ~/.cache/dependency-check
          key: owasp-dc-${{ runner.os }}-${{ hashFiles(format('{0}/**/*', env.SERVICE_DIR)) }}
          restore-keys: |
            owasp-dc-${{ runner.os }}-


      # -----------------------------------------------------------------------
      # OWASP Dependency-Check
      # -----------------------------------------------------------------------
      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        env:
          JAVA_HOME: /opt/jdk
        with:
          project: roboshop-${{ matrix.service }}
          path: ${{ env.SERVICE_DIR }}
          format: 'ALL'
          args: >
            --failOnCVSS 8
            --enableRetired
            --suppression security/dependency-check-suppression.xml


      # -----------------------------------------------------------------------
      # Upload Dependency-Check report
      # -----------------------------------------------------------------------
      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-${{ matrix.service }}-${{ github.sha }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 14


      # -----------------------------------------------------------------------
      # Docker Buildx
      # -----------------------------------------------------------------------
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3


      # -----------------------------------------------------------------------
      # Docker image build
      # -----------------------------------------------------------------------
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.SERVICE_DIR }}
          push: false
          load: true
          tags: ${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: false


      # -----------------------------------------------------------------------
      # Trivy image vulnerability scan
      #
      # Blocking gate:
      #   CRITICAL/HIGH + fixed vulnerabilities
      # -----------------------------------------------------------------------
      - name: Trivy image scan
        if: ${{ matrix.service != 'mysql' && matrix.service != 'shipping' }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.service }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          limit-severities-for-sarif: 'true'
          exit-code: '1'
          trivyignores: ${{ matrix.service == 'mysql' && 'apps/mysql/.trivyignore' || '.trivyignore' }}


      # -----------------------------------------------------------------------
      # Generate SBOM
      # -----------------------------------------------------------------------
      - name: Generate SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.service }}:${{ github.sha }}
          format: cyclonedx
          output: sbom-${{ matrix.service }}.cdx.json
          severity: 'CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN'


      # -----------------------------------------------------------------------
      # Upload security artifacts
      # -----------------------------------------------------------------------
      - name: Upload security artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-${{ matrix.service }}-${{ github.sha }}
          path: |
            trivy-${{ matrix.service }}.sarif
            sbom-${{ matrix.service }}.cdx.json
          if-no-files-found: ignore
          retention-days: 30


      # -----------------------------------------------------------------------
      # Upload Trivy SARIF
      # -----------------------------------------------------------------------
      - name: Upload Trivy SARIF
        if: ${{ always() && hashFiles(format('trivy-{0}.sarif', matrix.service)) != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}


      # -----------------------------------------------------------------------
      # Export exact scanned image
      # -----------------------------------------------------------------------
      - name: Export scanned image
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail

          docker save \
            "${{ matrix.service }}:${{ github.sha }}" \
            -o "${{ matrix.service }}.tar"


      # -----------------------------------------------------------------------
      # Upload exact scanned image
      # -----------------------------------------------------------------------
      - name: Upload scanned image artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.service }}-${{ github.sha }}
          path: ${{ matrix.service }}.tar
          if-no-files-found: error
          retention-days: 1


  # ===========================================================================
  # 3. Publish to Dev ECR
  # ===========================================================================
  publish:
    name: publish ${{ matrix.service }} to dev ECR

    needs:
      - detect
      - build

    if: >
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.detect.outputs.any == 'true'

    runs-on: ubuntu-latest

    timeout-minutes: 20

    environment: dev

    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect.outputs.services) }}

    steps:

      # -----------------------------------------------------------------------
      # Download exact scanned image
      # -----------------------------------------------------------------------
      - name: Download scanned image
        uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.service }}-${{ github.sha }}
          path: image


      # -----------------------------------------------------------------------
      # Load exact scanned image
      # -----------------------------------------------------------------------
      - name: Load scanned image
        run: |
          set -euo pipefail

          docker load \
            -i "image/${{ matrix.service }}.tar"


      # -----------------------------------------------------------------------
      # AWS OIDC
      # -----------------------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # -----------------------------------------------------------------------
      # ECR login
      # -----------------------------------------------------------------------
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        id: ecr


      # -----------------------------------------------------------------------
      # Push immutable image
      # -----------------------------------------------------------------------
      - name: Push immutable commit image
        id: push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail

          REPO="$REGISTRY/$ECR_NAMESPACE/${{ matrix.service }}"

          docker tag \
            "${{ matrix.service }}:${{ github.sha }}" \
            "$REPO:${{ github.sha }}"

          docker push "$REPO:${{ github.sha }}"

          DIGEST="$(
            docker inspect \
              --format='{{index .RepoDigests 0}}' \
              "$REPO:${{ github.sha }}" |
              cut -d@ -f2
          )"

          if [ -z "$DIGEST" ]; then
            echo "::error::Unable to determine pushed image digest"
            exit 1
          fi

          echo "image=$REPO@$DIGEST" >> "$GITHUB_OUTPUT"

          echo "Pushed:"
          echo "  $REPO:${{ github.sha }}"
          echo "  digest=$DIGEST"


      # -----------------------------------------------------------------------
      # Cosign
      # -----------------------------------------------------------------------
      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0


      # -----------------------------------------------------------------------
      # Sign immutable ECR image
      # -----------------------------------------------------------------------
      - name: Sign image with GitHub OIDC
        env:
          IMAGE: ${{ steps.push.outputs.image }}
        run: |
          set -euo pipefail

          IMAGE_REF="${IMAGE%%@*}"
          REPO_NAME="${IMAGE_REF#*/}"
          DIGEST="${IMAGE#*@}"
          DIGEST_HEX="${DIGEST#sha256:}"

          SIGNATURE_TAG="sha256-${DIGEST_HEX}.sig"

          signature_exists() {
            aws ecr describe-images \
              --region "${AWS_REGION}" \
              --repository-name "${REPO_NAME}" \
              --image-ids "imageTag=${SIGNATURE_TAG}" \
              --output text >/dev/null 2>&1
          }

          if signature_exists; then
            echo "::notice::Signature already exists for ${DIGEST}"

            cosign verify \
              --certificate-identity-regexp \
                "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/app-ci.yaml(?:@.*)?\$" \
              --certificate-oidc-issuer \
                "https://token.actions.githubusercontent.com" \
              "$IMAGE"

            exit 0
          fi

          if ! cosign sign --yes "$IMAGE"; then
            if signature_exists; then
              echo "::notice::Concurrent run created the signature"
              exit 0
            fi

            exit 1
          fi


  # ===========================================================================
  # 4. CI Gate
  # ===========================================================================
  ci-gate:
    name: ci gate

    if: always()

    needs:
      - detect
      - build
      - publish

    runs-on: ubuntu-latest

    steps:

      - name: Evaluate application CI
        env:
          DETECT_RESULT: ${{ needs.detect.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          set -euo pipefail

          if [[ "$DETECT_RESULT" != "success" ]]; then
            echo "::error::Service detection failed"
            exit 1
          fi

          if [[ "$BUILD_RESULT" == "failure" || "$BUILD_RESULT" == "cancelled" ]]; then
            echo "::error::Application build/test/security scan failed"
            exit 1
          fi

          if [[ "$PUBLISH_RESULT" == "failure" || "$PUBLISH_RESULT" == "cancelled" ]]; then
            echo "::error::Application image publish failed"
            exit 1
          fi

          echo "Application CI gate passed."


  # ===========================================================================
  # 5. GitOps write-back
  #
  # Runs ONLY after:
  #
  #   detect -> build -> publish -> CI gate
  #
  # Supported:
  #   - push to main
  #   - manual workflow_dispatch
  #
  # It updates GitOps and creates a PR.
  # It NEVER runs kubectl.
  # ArgoCD deploys after the GitOps PR is merged.
  # ===========================================================================
  gitops:
    name: GitOps write-back (dev)

    needs:
      - detect
      - publish
      - ci-gate

    if: >
      needs.detect.outputs.any == 'true' &&
      needs.publish.result == 'success' &&
      needs.ci-gate.result == 'success' &&
      (
        (
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        ) ||
        github.event_name == 'workflow_dispatch'
      )

    runs-on: ubuntu-latest

    timeout-minutes: 15

    environment: dev

    permissions:
      contents: write
      pull-requests: write
      id-token: write

    concurrency:
      group: gitops-writeback-dev
      cancel-in-progress: false

    steps:

      # -----------------------------------------------------------------------
      # Checkout
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITOPS_TOKEN || github.token }}
          fetch-depth: 0


      # -----------------------------------------------------------------------
      # Install yq
      # -----------------------------------------------------------------------
      - name: Install yq
        uses: mikefarah/yq@v4.53.3


      # -----------------------------------------------------------------------
      # AWS OIDC
      # -----------------------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # -----------------------------------------------------------------------
      # Update GitOps image references
      #
      # Only selected/changed services are modified.
      # -----------------------------------------------------------------------
      - name: Update GitOps image references
        env:
          SERVICES: ${{ needs.detect.outputs.services }}
          ENVIRONMENT: ${{ needs.detect.outputs.environment }}
          AWS_REGION: ${{ env.AWS_REGION }}
          ECR_NAMESPACE: ${{ env.ECR_NAMESPACE }}
        run: |
          set -euo pipefail

          REGISTRY="$(
            aws ecr describe-registry \
              --region "$AWS_REGION" \
              --query 'registryId' \
              --output text
          ).dkr.ecr.${AWS_REGION}.amazonaws.com"

          echo "ECR registry: $REGISTRY"
          echo "Services: $SERVICES"

          yq -i \
            ".image.registry = \"$REGISTRY\"" \
            environments/dev/global-values.yaml

          while IFS= read -r svc; do
            [ -n "$svc" ] || continue

            file="charts/$svc/values-$ENVIRONMENT.yaml"

            if [ ! -f "$file" ]; then
              echo "::error::GitOps values file not found: $file"
              exit 1
            fi

            digest="$(
              aws ecr describe-images \
                --region "$AWS_REGION" \
                --repository-name "$ECR_NAMESPACE/$svc" \
                --image-ids "imageTag=${GITHUB_SHA}" \
                --query 'imageDetails[0].imageDigest' \
                --output text
            )"

            if [ -z "$digest" ] || [ "$digest" = "None" ]; then
              echo "::error::Unable to find ECR image:"
              echo "  $ECR_NAMESPACE/$svc:${GITHUB_SHA}"
              exit 1
            fi

            yq -i \
              ".image.repository = \"$ECR_NAMESPACE/$svc\" |
               .image.tag = \"${GITHUB_SHA}\" |
               .image.digest = \"$digest\"" \
              "$file"

            echo "Updated $file"
            echo "Image: $ECR_NAMESPACE/$svc:${GITHUB_SHA}"
            echo "Digest: $digest"

          done < <(echo "$SERVICES" | yq -r '.[]' -p json)


      # -----------------------------------------------------------------------
      # Validate changed YAML files
      # -----------------------------------------------------------------------
      - name: Validate GitOps YAML
        run: |
          set -euo pipefail

          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR -- '*.yaml' '*.yml'
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "::notice::No YAML files changed"
            exit 0
          fi

          for file in "${files[@]}"; do
            echo "Validating $file"

            yq eval '.' "$file" >/dev/null || {
              echo "::error::Invalid YAML: $file"
              exit 1
            }
          done


      # -----------------------------------------------------------------------
      # Validate whitespace
      # -----------------------------------------------------------------------
      - name: Validate GitOps diff
        run: |
          set -euo pipefail

          git diff --check

          echo "Git status:"
          git status --short

          echo "GitOps diff:"
          git diff -- \
            environments/dev/global-values.yaml \
            charts/*/values-dev.yaml


      # -----------------------------------------------------------------------
      # Submit GitOps PR
      #
      # Existing repository script handles branch/commit/PR creation.
      # -----------------------------------------------------------------------
      - name: Submit GitOps PR
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN || github.token }}
        run: |
          set -euo pipefail

          ./scripts/create-gitops-pr.sh \
            "automation/dev-${GITHUB_RUN_ID}" \
            "chore(deploy): promote ${GITHUB_SHA} to dev" \
            "chore(deploy): dev -> ${GITHUB_SHA}" \
            "Automated GitOps update from application CI.

          Source commit: ${GITHUB_SHA}

          Workflow:
          ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          The application image was:
          - built
          - unit tested
          - security scanned
          - published to ECR
          - signed with Cosign
          - passed the CI gate

          ArgoCD will deploy the GitOps change after the PR is merged."
