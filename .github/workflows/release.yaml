name: release

# ---------------------------------------------------------------------------
# Cuts an immutable release from an already-built commit.
#
#   git tag v2.1.0 && git push origin v2.1.0
#
# NOTHING is rebuilt. The images produced by app-ci for this commit SHA are
# promoted to the production ECR registry, and a GitHub Release is created
# with the immutable release manifest. Helm charts remain Git-sourced and are
# deployed by Argo CD from the repository; they are validated in CI but are
# not published as a second OCI deployment source.
#
# The release is then rolled out with the "promote" workflow, environment by
# environment, using this exact version.
# ---------------------------------------------------------------------------
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  AWS_REGION: us-east-1
  SOURCE_AWS_REGION: ${{ vars.DEV_AWS_REGION || 'ap-south-1' }}
  ECR_NAMESPACE: roboshop
  SOURCE_ECR_NAMESPACE: roboshop
  SERVICES: 'cart catalogue user shipping payment frontend'

jobs:
  release:
    name: cut release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version
        id: v
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION"     >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA}"    >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN_PRODUCTION }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      # -- 1. promote the exact dev image into immutable production ECR -----
      - name: Install skopeo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo

      - name: Promote images from dev ECR to production ECR
        env:
          VERSION: ${{ steps.v.outputs.version }}
          SHA: ${{ steps.v.outputs.sha }}
          PROD_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          PROD_ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          SOURCE_REGISTRY="$PROD_ACCOUNT.dkr.ecr.$SOURCE_AWS_REGION.amazonaws.com"
          aws ecr get-login-password --region "$SOURCE_AWS_REGION" | skopeo login --username AWS --password-stdin "$SOURCE_REGISTRY"
          aws ecr get-login-password --region "$AWS_REGION" | skopeo login --username AWS --password-stdin "$PROD_REGISTRY"
          mkdir -p .release
          for svc in $SERVICES; do
            src="docker://$SOURCE_REGISTRY/$SOURCE_ECR_NAMESPACE/$svc:$SHA"
            dst="docker://$PROD_REGISTRY/$ECR_NAMESPACE/$svc:$VERSION"
            skopeo copy --all "$src" "$dst"
            digest=$(aws ecr describe-images --region "$AWS_REGION" --repository-name "$ECR_NAMESPACE/$svc" --image-ids imageTag="$VERSION" --query 'imageDetails[0].imageDigest' --output text)
            echo "$svc $VERSION $digest" >> image-digests.txt
            echo "promoted $svc:$SHA -> $svc:$VERSION ($digest)"
          done

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Sign production release images
        env:
          VERSION: ${{ steps.v.outputs.version }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          for svc in $SERVICES; do
            digest=$(aws ecr describe-images --region "$AWS_REGION" --repository-name "$ECR_NAMESPACE/$svc" --image-ids imageTag="$VERSION" --query 'imageDetails[0].imageDigest' --output text)

            # Idempotent keyless signing: ECR tags are immutable, so a release
            # re-run for the same digest must skip the duplicate signature
            # write (sha256-<hex>.sig) instead of failing with TAG_INVALID.
            signature_tag="sha256-${digest#sha256:}.sig"
            if aws ecr describe-images \
                --region "$AWS_REGION" \
                --repository-name "$ECR_NAMESPACE/$svc" \
                --image-ids "imageTag=${signature_tag}" \
                --output text >/dev/null 2>&1; then
              echo "signature ${signature_tag} already exists for ${digest} - skipping duplicate signing"
              continue
            fi

            cosign sign --yes "$REGISTRY/$ECR_NAMESPACE/$svc@$digest"
          done

      # -- 2. release manifest: the single source of truth for promotion ------
      - name: Write release manifest
        env:
          VERSION: ${{ steps.v.outputs.version }}
          SHA: ${{ steps.v.outputs.sha }}
        run: |
          set -euo pipefail
          {
            echo "# Generated by .github/workflows/release.yaml - do not edit by hand."
            echo "version: \"$VERSION\""
            echo "gitSha: \"$SHA\""
            echo "released: \"$(date -u +%FT%TZ)\""
            echo "images:"
            while read -r svc ver digest; do
              echo "  $svc:"
              echo "    tag: \"$ver\""
              echo "    digest: \"$digest\""
            done < image-digests.txt
          } > releases/${{ steps.v.outputs.version }}.yaml

      - uses: mikefarah/yq@v4.44.3

      - name: Update dev to the release artifact
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          PROD_ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          DEV_REGISTRY="$PROD_ACCOUNT.dkr.ecr.$SOURCE_AWS_REGION.amazonaws.com"
          for svc in $SERVICES; do
            f="charts/$svc/values-dev.yaml"
            [ -f "$f" ] || continue
            digest=$(awk -v s="$svc" '$1==s {print $3}' image-digests.txt)
            yq -i ".image.registry = \"$DEV_REGISTRY\" | .image.repository = \"roboshop/$svc\" | .image.tag = \"$VERSION\" | .image.digest = \"$digest\"" "$f"
          done
          mkdir -p environments/dev
          cat > environments/dev/version.yaml <<EOF
          # Live release in dev. Written by .github/workflows/release.yaml.
          environment: dev
          version: "$VERSION"
          promotedAt: "$(date -u +%FT%TZ)"
          promotedBy: "release"
          EOF

      - name: Submit release GitOps PR
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN || github.token }}
        run: |
          git fetch origin main
          git checkout main
          ./scripts/create-gitops-pr.sh \
            "automation/release-${{ steps.v.outputs.version }}" \
            "chore(release): ${{ steps.v.outputs.version }}" \
            "chore(release): publish ${{ steps.v.outputs.version }}" \
            "Automated immutable release manifest and dev GitOps update for ${{ steps.v.outputs.version }}."

      - name: Verify dev release
        env:
          DEV_SMOKE_BASE_URL: ${{ vars.DEV_SMOKE_BASE_URL }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          [ -n "${DEV_SMOKE_BASE_URL:-}" ] || { echo "::error::DEV_SMOKE_BASE_URL repository variable is required"; exit 1; }
          ./scripts/smoke-test.sh "$DEV_SMOKE_BASE_URL" "$VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.v.outputs.version }}
          generate_release_notes: true
          files: dist/*.tgz
          body: |
            ## Artifacts

            Container images (ECR, `${{ env.ECR_NAMESPACE }}/<service>:${{ steps.v.outputs.version }}`)
            were promoted from commit `${{ steps.v.outputs.sha }}` — **not rebuilt**.
            Helm charts remain Git-sourced and are deployed by Argo CD.

            Roll out with the `promote` workflow:
            `version=${{ steps.v.outputs.version }}`, `environment=dev|qa|staging|production`.

      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then exit 0; fi
          [ "$STATUS" = "success" ] && icon=":package:" || icon=":rotating_light:"
          text="$icon Release *v$VERSION* $STATUS - immutable images promoted from \`${{ steps.v.outputs.sha }}\`.\nPromote with the *promote* workflow (dev -> qa -> staging -> production)."
          curl -sS -X POST -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg t "$text" --arg u "${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}" \
              '{text: ($t + "\n<" + $u + "|release notes>")}')" \
            "$SLACK_WEBHOOK_URL" >/dev/null
