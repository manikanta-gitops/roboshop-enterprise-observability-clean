# =============================================================================
# DAST: OWASP ZAP baseline scan against a deployed environment.
# Runs nightly against dev and on demand against any URL.
# =============================================================================
name: dast-zap

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      target_url:
        description: URL to scan
        required: true
        default: 'https://dev.roboshop.example.com'
        type: string

permissions:
  contents: read
  issues: write

jobs:
  zap:
    name: ZAP baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Resolve target
        id: target
        run: |
          URL="${{ inputs.target_url }}"
          [ -n "$URL" ] || URL="${{ vars.DEV_BASE_URL }}"
          [ -n "$URL" ] || URL="https://dev.roboshop.example.com"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      # NOTE: For maximum supply-chain security, pin this to the commit SHA
      # of v0.12.0 instead of the mutable tag. Retrieve the SHA from:
      # https://github.com/zaproxy/action-baseline/releases/tag/v0.12.0
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ steps.target.outputs.url }}
          rules_file_name: security/zap/rules.tsv
          cmd_options: '-a -j -T 5'
          allow_issue_writing: true
          fail_action: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: |
            report_html.html
            report_json.json
          retention-days: 30
