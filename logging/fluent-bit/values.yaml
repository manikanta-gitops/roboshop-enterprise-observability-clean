# ---------------------------------------------------------------------------
# Fluent Bit values (chart: fluent/fluent-bit)
# Tails container logs, enriches them with Kubernetes metadata and ships them
# to the in-cluster OpenSearch. One DaemonSet pod per node.
# ---------------------------------------------------------------------------

fullnameOverride: fluent-bit

image:
  repository: cr.fluentbit.io/fluent/fluent-bit
  tag: 3.1.6

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

tolerations:
  - operator: Exists

serviceMonitor:
  enabled: true
  namespace: logging
  additionalLabels:
    release: monitoring

# Credentials come from the `opensearch-credentials` secret created by
# External Secrets; they are injected as environment variables.
env:
  - name: OPENSEARCH_USER
    valueFrom:
      secretKeyRef:
        name: opensearch-credentials
        key: username
  - name: OPENSEARCH_PASSWORD
    valueFrom:
      secretKeyRef:
        name: opensearch-credentials
        key: password

config:
  service: |
    [SERVICE]
        Daemon              Off
        Flush               5
        Log_Level           info
        Parsers_File        /fluent-bit/etc/parsers.conf
        Parsers_File        custom_parsers.conf
        HTTP_Server         On
        HTTP_Listen         0.0.0.0
        HTTP_Port           2020
        Health_Check        On
        storage.path        /var/log/flb-storage/
        storage.sync        normal
        storage.checksum    off
        storage.backlog.mem_limit 64M

  inputs: |
    [INPUT]
        Name                tail
        Tag                 kube.*
        Path                /var/log/containers/*.log
        Exclude_Path        /var/log/containers/*fluent-bit*.log,/var/log/containers/*opensearch*.log
        multiline.parser    docker, cri
        Mem_Buf_Limit       32MB
        Skip_Long_Lines     On
        Refresh_Interval    10
        DB                  /var/log/flb_kube.db

    [INPUT]
        Name                systemd
        Tag                 host.*
        Systemd_Filter      _SYSTEMD_UNIT=kubelet.service
        Systemd_Filter      _SYSTEMD_UNIT=containerd.service
        Read_From_Tail      On

  filters: |
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_Tag_Prefix     kube.var.log.containers.
        Merge_Log           On
        Merge_Log_Key       log_processed
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On
        Labels              On
        Annotations         Off
        Buffer_Size         1MB

    # Drop noisy health-check lines before they cost OpenSearch storage.
    [FILTER]
        Name                grep
        Match               kube.*
        Exclude             log /healthz|/readyz|kube-probe

    [FILTER]
        Name                nest
        Match               kube.*
        Operation           lift
        Nested_under        kubernetes
        Add_prefix          k8s_

    [FILTER]
        Name                modify
        Match               kube.*
        Add                 cluster roboshop
        Remove              k8s_pod_id
        Remove              k8s_docker_id
        Remove              k8s_container_hash

  outputs: |
    [OUTPUT]
        Name                opensearch
        Match               kube.*
        Host                opensearch-cluster-master.logging.svc.cluster.local
        Port                9200
        HTTP_User           ${OPENSEARCH_USER}
        HTTP_Passwd         ${OPENSEARCH_PASSWORD}
        tls                 On
        tls.verify          Off
        Logstash_Format     On
        Logstash_Prefix     roboshop
        Logstash_DateFormat %Y.%m.%d
        Time_Key            @timestamp
        Replace_Dots        On
        Suppress_Type_Name  On
        Trace_Error         On
        Retry_Limit         5
        Buffer_Size         8MB

    [OUTPUT]
        Name                opensearch
        Match               host.*
        Host                opensearch-cluster-master.logging.svc.cluster.local
        Port                9200
        HTTP_User           ${OPENSEARCH_USER}
        HTTP_Passwd         ${OPENSEARCH_PASSWORD}
        tls                 On
        tls.verify          Off
        Logstash_Format     On
        Logstash_Prefix     roboshop-host
        Suppress_Type_Name  On

  customParsers: |
    [PARSER]
        Name                roboshop_json
        Format              json
        Time_Key            time
        Time_Format         %Y-%m-%dT%H:%M:%S.%L%z
        Time_Keep           On
